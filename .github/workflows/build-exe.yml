name: Build EICAR Module EXE

on:
  push:
    paths:
      - 'windows/eicar.module.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          cd windows
          pyinstaller --onefile --console --name eicar.module eicar.module.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: eicar-module-exe
          path: windows/dist/eicar.module.exe